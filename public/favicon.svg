<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 310">
  <rect width="320" height="310" fill="white"/>
  <g stroke="#0E5CB2" fill="none" stroke-width="30" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left stem (p) -->
    <line x1="35" y1="290" x2="35" y2="100"/>
    <!-- Roof: left slope up to peak (above p-b divider) -->
    <line x1="35" y1="100" x2="118" y2="18"/>
    <!-- Roof: right slope from peak to right wall -->
    <line x1="118" y1="18" x2="285" y2="100"/>
    <!-- Right wall -->
    <line x1="285" y1="100" x2="285" y2="290"/>
    <!-- Divider 1: p | b (under peak) -->
    <line x1="118" y1="100" x2="118" y2="290"/>
    <!-- Divider 2: b | b -->
    <line x1="202" y1="100" x2="202" y2="290"/>
    <!-- p bowl: downward semicircle -->
    <path d="M 35 208 A 41.5 41.5 0 0 1 118 208"/>
    <!-- b1 bowl -->
    <path d="M 118 208 A 42 42 0 0 1 202 208"/>
    <!-- b2 bowl -->
    <path d="M 202 208 A 41.5 41.5 0 0 1 285 208"/>
  </g>
</svg>
