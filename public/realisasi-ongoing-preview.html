<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Preview — Realisasi On Going</title>
<style>
  :root{
    --text-primary:#0F1C2E; --text-secondary:#5C6B82; --text-muted:#64748B;
    --card:#fff; --surface-raised:#f8fafc; --surface-2:#eef2f7; --surface-subtle:#eef2f7;
    --border:#dfe5ee; --border-subtle:#e8edf4; --green:#059669; --blue:#1A6FE8; --blue-dark:#1560d4;
  }
  *{box-sizing:border-box;-webkit-font-smoothing:antialiased}
  body{margin:0;background:#f1f4f9;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:var(--text-primary)}
  .wrap{max-width:440px;margin:0 auto;padding:16px 14px 60px}
  .bar{max-width:440px;margin:0 auto 4px;padding:14px 14px 2px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .seg{display:inline-flex;background:#e3e9f2;border-radius:99px;padding:3px}
  .seg button{border:none;background:transparent;padding:6px 14px;border-radius:99px;font-size:12.5px;font-weight:700;color:var(--text-secondary);cursor:pointer;font-family:inherit}
  .seg button.on{background:var(--blue);color:#fff}
  .hint{font-size:11.5px;color:var(--text-muted);padding:0 2px 8px;max-width:440px;margin:0 auto}
  h1.title{font-size:13px;margin:0 0 3px;letter-spacing:-.02em}
  .metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:14px}
  .m{background:var(--card);border-radius:12px;padding:12px 13px;border:1px solid var(--border-subtle);box-shadow:0 1px 3px rgba(0,0,0,.04)}
  .m .lbl{font-size:9.5px;color:var(--text-muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
  .m .val{font-size:15px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
  /* rincian card */
  .rc{background:var(--card);border:1px solid var(--border-subtle);border-radius:14px;box-shadow:0 1px 3px rgba(0,0,0,.05);padding:15px 16px;margin-bottom:14px}
  .rc .head{display:flex;align-items:center;gap:9px;margin:4px 2px}
  .rc .head .barline{width:4px;height:17px;border-radius:2px;background:var(--green)}
  .rc .head h2{font-size:13px;font-weight:700;letter-spacing:-.02em;margin:0}
  .rc .head .cnt{margin-left:auto;font-size:11.5px;color:var(--text-muted);font-weight:600}
  .toggle{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;margin-top:8px;padding:9px 12px;border-radius:10px;border:1px solid var(--border-subtle);background:var(--surface-raised);cursor:pointer;font-family:inherit}
  .toggle.open{background:var(--surface-2)}
  .toggle .left{display:flex;align-items:baseline;gap:8px}
  .toggle .t1{font-size:12.5px;font-weight:600;color:var(--blue)}
  .toggle .t2{font-size:11.5px;font-weight:700;color:var(--text-secondary);font-variant-numeric:tabular-nums}
  .chev{transition:transform .2s}
  .toggle.open .chev{transform:rotate(180deg)}
  /* recorded-vs-realisasi context bar */
  .ctx{margin-top:11px;border-radius:11px;background:rgba(26,111,232,.05);border:1px solid rgba(26,111,232,.14);padding:11px 13px}
  .ctx .row{display:flex;align-items:baseline;justify-content:space-between;gap:10px;font-size:11.5px;color:var(--text-secondary);font-weight:600}
  .ctx b{color:var(--text-primary);font-variant-numeric:tabular-nums}
  .ctx .track{height:7px;border-radius:6px;background:#e2e8f2;overflow:hidden;margin-top:8px}
  .ctx .fill{height:100%;background:var(--blue);border-radius:6px}
  .ctx .note{font-size:10.5px;color:var(--text-muted);margin-top:7px;line-height:1.4}
  .body{margin-top:13px}
  .loc{margin-top:0}
  .loc+.loc{margin-top:14px}
  .loch{background:#dbe0e8;border-radius:9px 9px 0 0;padding:8px 12px;font-size:12px;font-weight:700}
  .locb{border:1px solid var(--border-subtle);border-top:none;border-radius:0 0 9px 9px;overflow:hidden}
  .lr{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:9px 12px;background:var(--surface-raised)}
  .lr+.lr{border-top:1px solid var(--border-subtle)}
  .lr .nm{font-size:12px;font-weight:600}
  .lr .sub{font-size:11px;color:var(--text-muted);margin-top:2px}
  .lr .bi{font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
  .locf{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:var(--surface-2);border-top:1px solid var(--border-subtle)}
  .locf .l{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--text-secondary)}
  .locf .v{font-size:12.5px;font-weight:800;font-variant-numeric:tabular-nums}
  /* metadata table */
  .tblcard{background:var(--card);border-radius:14px;border:1px solid var(--border-subtle);padding:14px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
  .tblhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .tblhead h3{font-size:12px;font-weight:700;margin:0;letter-spacing:-.02em}
  .btns{display:flex;gap:8px}
  .btn-o{display:flex;align-items:center;gap:6px;background:var(--card);color:var(--blue);border:1px solid rgba(26,111,232,.3);border-radius:8px;padding:6px 12px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit}
  .btn-p{background:var(--blue);color:#fff;border:none;border-radius:8px;padding:6px 12px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit}
  table{width:100%;border-collapse:collapse;font-size:13px}
  td{padding:9px 0;vertical-align:top}
  tr+tr td{border-top:1px solid var(--surface-subtle)}
  td.k{color:var(--text-muted);font-weight:600;width:42%;font-size:12px}
  td.v{color:var(--text-primary);font-size:13px}
  .badge{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;background:rgba(10,123,200,.12);color:#0A7BC8}
  .flag{max-width:440px;margin:10px auto 0;font-size:11px;color:var(--text-muted);padding:0 4px;line-height:1.5}
</style>
</head>
<body>
  <div class="bar">
    <span class="seg">
      <button id="v-ringkas" class="on" onclick="setVar('ringkas')">Ringkas (usulan) ✅</button>
      <button id="v-padat" onclick="setVar('padat')">Padat (sekarang)</button>
    </span>
  </div>
  <div class="hint">Contoh pekerjaan <b>On Going</b> — Realisasi resmi Rp320jt, rincian tercatat Rp300jt. Bandingkan versi <b>Ringkas</b> vs <b>Padat</b>.</div>

  <div class="wrap">
    <!-- METRIC CARDS -->
    <div class="metrics">
      <div class="m"><div class="lbl">Total Anggaran</div><div class="val" style="color:var(--blue)">Rp500 jt</div></div>
      <div class="m"><div class="lbl">Realisasi Terkini</div><div class="val" style="color:#059669">Rp320 jt</div></div>
      <div class="m"><div class="lbl">Sisa Anggaran</div><div class="val" style="color:#D97706">Rp180 jt</div></div>
      <div class="m"><div class="lbl">Progress</div><div class="val" style="color:#0A7BC8">64%</div></div>
    </div>

    <!-- RINCIAN CARD -->
    <div id="slot-atas"></div>

    <!-- METADATA TABLE -->
    <div class="tblcard">
      <div class="tblhead">
        <h3 id="tbltitle">Detail Pekerjaan</h3>
        <div class="btns">
          <button class="btn-o">✎ Catat Realisasi</button>
          <button class="btn-p">Edit</button>
        </div>
      </div>
      <table><tbody id="tblbody"></tbody></table>
    </div>
  </div>

  <div class="flag" id="flag"></div>

<script>
  let open = false, variant = 'ringkas';

  const detailBody = `
    <div class="body">
      <div class="loc">
        <div class="loch">Aula Utama — Lantai Dasar</div>
        <div class="locb">
          <div class="lr"><div><div class="nm">Keramik 60×60</div><div class="sub">240 m²</div></div><div class="bi">Rp96.000.000</div></div>
          <div class="lr"><div><div class="nm">Plafon gypsum</div><div class="sub">180 m²</div></div><div class="bi">Rp54.000.000</div></div>
          <div class="locf"><span class="l">Nilai Total</span><span class="v">Rp150.000.000</span></div>
        </div>
      </div>
      <div class="loc">
        <div class="loch">Aula Utama — Panggung</div>
        <div class="locb">
          <div class="lr"><div><div class="nm">Rangka baja ringan</div><div class="sub">1 paket</div></div><div class="bi">Rp90.000.000</div></div>
          <div class="lr"><div><div class="nm">Pengecatan</div><div class="sub">320 m²</div></div><div class="bi">Rp60.000.000</div></div>
          <div class="locf"><span class="l">Nilai Total</span><span class="v">Rp150.000.000</span></div>
        </div>
      </div>
    </div>`;

  function rincianCardHTML(){
    // Ringkas: konteks jadi 1 baris halus di dalam detail (bukan kotak progress).
    // Padat: kotak progress bar penuh + selalu tampil.
    const subtle = variant==='ringkas'
      ? `<div style="font-size:11px;color:var(--text-muted);margin:11px 2px 0;line-height:1.45">Rincian tercatat <b style="color:var(--text-secondary)">Rp300 jt</b> dari realisasi <b style="color:var(--text-secondary)">Rp320 jt</b> · sisa Rp20 jt belum dirinci</div>`
      : '';
    const ctxBox = variant==='padat'
      ? `<div class="ctx">
           <div class="row"><span>Sudah tercatat rinciannya</span><b>Rp300 jt <span style="color:var(--text-muted);font-weight:600">/ Rp320 jt</span></b></div>
           <div class="track"><div class="fill" style="width:93.75%"></div></div>
           <div class="note">93% dari realisasi resmi sudah ada rinciannya. Sisa Rp20 jt belum dirinci.</div>
         </div>`
      : '';
    const totalTxt = variant==='ringkas' ? '· Total Rp300 jt' : '· Total Rp300 jt tercatat';
    const body = open ? (variant==='ringkas' ? subtle + detailBody : detailBody) : '';
    return `
      <div class="rc">
        <div class="head"><span class="barline"></span><h2>Rincian Realisasi Pekerjaan</h2><span class="cnt">2 lokasi</span></div>
        <button class="toggle ${open?'open':''}" onclick="open=!open;render()">
          <span class="left"><span class="t1">${open?'Sembunyikan detail':'Tampilkan detail'}</span><span class="t2">${totalTxt}</span></span>
          <svg class="chev" width="15" height="15" fill="none" stroke="var(--blue)" stroke-width="2.4" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
        </button>
        ${ctxBox}
        ${body}
      </div>`;
  }

  const ROW = (k,v)=>`<tr><td class="k">${k}</td><td class="v">${v}</td></tr>`;
  const META_RINGKAS = [
    ['Program','Renovasi Gedung'],['Nama Pekerjaan','Renovasi Aula Utama'],
    ['Jenis Pekerjaan','Fisik / Konstruksi'],['Vendor','CV Karya Bangun'],
    ['Catatan','Menunggu material tahap 2'],
  ];
  const META_PADAT = [
    ['ID','PBB-014'],['Program','Renovasi Gedung'],['Nama Pekerjaan','Renovasi Aula Utama'],
    ['Jenis Pekerjaan','Fisik / Konstruksi'],['Status','<span class="badge">On Going</span>'],
    ['Progress','64%'],['Total Anggaran','Rp500.000.000'],['Realisasi Terkini','Rp320.000.000'],
    ['Sisa Anggaran','Rp180.000.000'],['Vendor','CV Karya Bangun'],['Dibuat','2 Feb 2026'],
  ];

  function render(){
    document.getElementById('slot-atas').innerHTML = rincianCardHTML();
    const rows = (variant==='ringkas' ? META_RINGKAS : META_PADAT).map(r=>ROW(r[0],r[1])).join('');
    document.getElementById('tblbody').innerHTML = rows;
    document.getElementById('tbltitle').textContent = variant==='ringkas' ? 'Detail Pekerjaan' : 'Ringkasan Pekerjaan';
    document.getElementById('flag').innerHTML = variant==='ringkas'
      ? 'Versi <b>Ringkas</b>: baris uang (Anggaran/Realisasi/Sisa/Progress) dibuang dari tabel karena sudah ada di kartu atas → halaman lebih pendek, tidak ada angka dobel.'
      : 'Versi <b>Padat</b>: tabel mengulang semua angka uang yang sudah ada di metric cards → inilah yang bikin terasa numpuk.';
  }
  function setVar(v){ variant=v;
    document.getElementById('v-ringkas').className=v==='ringkas'?'on':'';
    document.getElementById('v-padat').className=v==='padat'?'on':'';
    document.getElementById('v-ringkas').textContent = v==='ringkas'?'Ringkas (usulan) ✅':'Ringkas (usulan)';
    document.getElementById('v-padat').textContent = v==='padat'?'Padat (sekarang) ✅':'Padat (sekarang)';
    render();
  }
  render();
</script>
</body>
</html>
